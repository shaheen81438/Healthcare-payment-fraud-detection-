name: healthcare-payment-integrity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-payment_integrity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first initialization of the volume: creates app schemas + the mlflow database.
      - ./scripts/sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-pi_user}:${POSTGRES_PASSWORD:-pi_password_change_me}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlartifacts:/mlartifacts

  api:
    profiles: ["serve"]
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-pi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-payment_integrity}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENV: ${ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"

  dashboard:
    profiles: ["serve"]
    build:
      context: .
      target: dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app_env
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

volumes:
  pgdata:
  mlartifacts:
