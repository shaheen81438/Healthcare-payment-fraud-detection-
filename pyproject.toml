[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-payment-integrity"
version = "0.1.0"
description = "Healthcare claims payment-integrity and FWA detection platform: rules + ML risk scoring, SHAP explainability, investigator dashboard, and drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faridoon Farahi" }]
keywords = ["healthcare", "fraud-detection", "payment-integrity", "machine-learning", "mlops"]

# Runtime dependencies. Mirrored in requirements.txt for Docker builds — keep in sync.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "shap>=0.46",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "mlflow>=2.19,<3",
    "evidently>=0.7,<0.8",
    "streamlit>=1.38",
    "pyyaml>=6",
    "joblib>=1.4",
    "requests>=2.32",
    "matplotlib>=3.9",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["src*", "app*"]

# --------------------------------------------------------------------------
# Ruff: formatting + linting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF002", # en-dashes / multiplication signs in docstrings are intentional
    "RUF003", # same, in comments
    "N803",   # X / y argument names are ML convention
    "N806",   # X / Xt variable names are ML convention
]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages must fix sys.path before importing project modules.
"app/dashboard/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]

# --------------------------------------------------------------------------
# MyPy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "shap.*",
    "mlflow.*",
    "evidently.*",
    "streamlit.*",
    "xgboost.*",
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["altair.*"]
ignore_missing_imports = true

# Streamlit pages are scripts (module-level flow; st.* APIs are dynamically
# typed and verified by rendering). Static analysis adds noise, not safety, here.
[[tool.mypy.overrides]]
module = "app.dashboard.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

# --------------------------------------------------------------------------
# Pytest / coverage
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated tests (default)",
    "integration: tests requiring Postgres or docker services",
    "slow: long-running tests (e.g. model training)",
]

[tool.coverage.run]
source = ["src", "app"]
omit = ["app/dashboard/*"]
