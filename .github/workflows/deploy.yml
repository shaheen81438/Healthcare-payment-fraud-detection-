name: Deploy to Azure Container Apps

# Deploys only when triggered manually (or on a version tag) and the Azure OIDC
# secrets are configured. Safe to keep in a public repo: without the secrets the
# workflow fails at login and changes nothing.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Container Apps environment suffix"
        required: false
        default: "prod"
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC federated login, so no cloud passwords are stored
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-payment-integrity
  ACR_NAME: crpaymentintegrity
  API_APP: pi-api
  DASHBOARD_APP: pi-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Entra authentication is enforced before updating images
        env:
          ENTRA_ALLOWED_GROUP_ID: ${{ secrets.AZURE_ENTRA_ALLOWED_GROUP_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$ENTRA_ALLOWED_GROUP_ID" ]]; then
            echo "AZURE_ENTRA_ALLOWED_GROUP_ID must be configured" >&2
            exit 1
          fi
          for app in "$API_APP" "$DASHBOARD_APP"; do
            action=$(az containerapp auth show -n "$app" -g "$AZURE_RESOURCE_GROUP" \
              --query globalValidation.unauthenticatedClientAction -o tsv)
            groups=$(az containerapp auth show -n "$app" -g "$AZURE_RESOURCE_GROUP" \
              --query identityProviders.azureActiveDirectory.validation.defaultAuthorizationPolicy.allowedPrincipals.groups -o tsv)
            if [[ "$action" == "AllowAnonymous" || -z "$action" || -z "$groups" ]]; then
              echo "Authentication or group authorization is missing for $app" >&2
              exit 1
            fi
            if ! grep -Fqi "$ENTRA_ALLOWED_GROUP_ID" <<<"$groups"; then
              echo "Configured Entra group does not match the approved deployment group on $app" >&2
              exit 1
            fi
          done

      - name: Build + push images in ACR
        run: |
          az acr build --registry $ACR_NAME --image pi-api:${{ github.sha }} --target api .
          az acr build --registry $ACR_NAME --image pi-dashboard:${{ github.sha }} --target dashboard .

      - name: Update Container Apps
        run: |
          az containerapp update -n $API_APP -g $AZURE_RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/pi-api:${{ github.sha }}
          az containerapp update -n $DASHBOARD_APP -g $AZURE_RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/pi-dashboard:${{ github.sha }}

      - name: Smoke-check protected endpoints
        run: |
          API_FQDN=$(az containerapp show -n "$API_APP" -g "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          DASHBOARD_FQDN=$(az containerapp show -n "$DASHBOARD_APP" -g "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            API_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://$API_FQDN/health" || true)
            DASHBOARD_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://$DASHBOARD_FQDN/" || true)
            if [[ "$API_STATUS" == "401" && "$DASHBOARD_STATUS" == "302" ]]; then
              echo "Unauthenticated API and dashboard requests are denied or redirected."
              exit 0
            fi
            sleep 5
          done
          echo "Protected endpoint smoke check failed (API=$API_STATUS dashboard=$DASHBOARD_STATUS)" >&2
          exit 1
