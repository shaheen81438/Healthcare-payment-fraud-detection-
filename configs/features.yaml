# Feature engineering configuration.

# Temporal split by service month. The burn-in window only provides feature
# history; its rows are never used as training examples.
splits:
  burn_in_end: "2024-03"     # months <= this are burn-in
  train_end: "2025-03"       # burn_in_end < train <= this
  val_end: "2025-06"         # calibration and threshold tuning window
  # everything after val_end is test

# Duplicate similarity (backward-looking only)
duplicates:
  window_days: 45
  weights:
    same_provider: 0.30
    amount_close: 0.20       # |Δ paid| / max(paid) <= 2%
    same_pos: 0.15
    same_units: 0.15
    same_modifier: 0.10
    date_proximity: 0.10     # scaled 1 - Δdays/window
  exact_amount_tolerance: 0.01

# Peer statistics (fit on the train window only, then frozen)
peer_stats:
  min_code_n: 30             # fall back to global stats below this support
  min_spec_code_n: 20
  high_cost_multiplier: 2.0  # paid/unit above this x code median counts as high-cost

# Provider rolling features: monthly grain, lagged one month (as-of correctness)
provider_rolling:
  trailing_months: 3
